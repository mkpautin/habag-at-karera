services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: habag
      POSTGRES_USER: habag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habag -d habag"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    image: ${IMAGE_REPOSITORY:-ghcr.io/mkpautin/habag-at-karera}:${IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    ports:
      - "${APP_PORT:-3000}:3000"
  migrate:
    image: ${IMAGE_REPOSITORY:-ghcr.io/mkpautin/habag-at-karera}:${IMAGE_TAG:-latest}-migrate
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      GROUP_1_PASSWORD: ${GROUP_1_PASSWORD:?set GROUP_1_PASSWORD}
      GROUP_2_PASSWORD: ${GROUP_2_PASSWORD:?set GROUP_2_PASSWORD}
      GROUP_3_PASSWORD: ${GROUP_3_PASSWORD:?set GROUP_3_PASSWORD}
      GROUP_4_PASSWORD: ${GROUP_4_PASSWORD:?set GROUP_4_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
volumes:
  postgres_data:
